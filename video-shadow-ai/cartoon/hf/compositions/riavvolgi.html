<template>
<style>
  #riavvolgi { position:absolute; inset:0; overflow:hidden; }
  #riavvolgi svg.stage { position:absolute; left:0; top:0; }

  .tag { position:absolute; background:#f1ebde url(assets/paper.png); background-blend-mode:multiply; color:#1c2230;
         box-shadow: 0 3px 0 rgba(60,40,20,.25), 0 14px 30px rgba(0,0,0,.28); border-radius:4px; }
  .tag.cu { background-color:#b5562a; color:#fbf4ea; } .tag.navy { background-color:#16233a; color:#f1ebde; }
  .lbl { font-family:'Inter'; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
  .ttl { font-family:'EB Garamond'; font-weight:700; }
  .mono { font-family:'IBM Plex Mono'; font-weight:700; }

</style>
<div id="riavvolgi" data-composition-id="riavvolgi" data-width="1920" data-height="1080">
  <svg class="stage" width="1920" height="1080" viewBox="0 0 1920 1080" data-layout-ignore></svg>
<div id="rw-tag" class="tag ttl" style="left:0; right:0; margin:auto; width:720px; top:120px; padding:14px 0 8px; text-align:center; font-size:96px"><span style="color:#9a3f17">◀◀</span> Riavvolgiamo</div>
</div>
<script>
(function () {
  const SID = "riavvolgi", DUR = 2.890, S0 = 47.626;
  const LINES = [{"scene": "buongiorno", "start": 2.0, "end": 6.704, "caption": "Buongiorno! Sono un contratto. Tre pagine, due firme… e parecchi dati riservati.", "pauses": [[0.0, 4.704]], "speech": 4.704}, {"scene": "fretta", "start": 7.804, "end": 10.131, "caption": "Ore nove e quindici. Qualcuno ha fretta.", "pauses": [[0.0, 2.327]], "speech": 2.327}, {"scene": "fretta", "start": 11.181, "end": 13.583, "caption": "Mi copia… e mi incolla in un chatbot trovato online.", "pauses": [[0.0, 2.402]], "speech": 2.402}, {"scene": "fretta", "start": 14.933, "end": 16.438, "caption": "Gratis. Che fortuna.", "pauses": [[0.0, 1.505]], "speech": 1.505}, {"scene": "nessuno", "start": 17.638, "end": 22.092, "caption": "Nessuno l'ha vietato. Nessuno l'ha autorizzato. Diciamo che… nessuno ha chiesto.", "pauses": [[0.0, 1.232], [1.344, 4.454]], "speech": 4.454}, {"scene": "viaggio", "start": 23.792, "end": 25.382, "caption": "Trenta secondi, ed è fatto.", "pauses": [[0.0, 1.59]], "speech": 1.59}, {"scene": "viaggio", "start": 27.232, "end": 30.354, "caption": "Peccato che adesso io sia qui. Non so nemmeno in che paese.", "pauses": [[0.0, 3.122]], "speech": 3.122}, {"scene": "nome", "start": 31.154, "end": 32.938, "caption": "Questa si chiama Shadow AI.", "pauses": [[0.0, 1.784]], "speech": 1.784}, {"scene": "rischio", "start": 35.038, "end": 44.723, "caption": "E il rischio è doppio. Per l'azienda: dati dei clienti esposti, informazioni riservate fuori controllo. Per te: errori che firmi tu, e regole aziendali violate.", "pauses": [[0.0, 1.552], [1.696, 9.685]], "speech": 9.685}, {"scene": "rischio", "start": 45.673, "end": 46.926, "caption": "Firmate da te, eh.", "pauses": [[0.0, 1.253]], "speech": 1.253}, {"scene": "riavvolgi", "start": 48.626, "end": 49.516, "caption": "Riavvolgiamo.", "pauses": [[0.0, 0.89]], "speech": 0.89}, {"scene": "giusta", "start": 51.816, "end": 57.176, "caption": "Stessa azienda, tre cose in più. Uno strumento approvato. Regole chiare. Persone formate.", "pauses": [[0.0, 1.584], [1.696, 4.048], [4.192, 5.36]], "speech": 5.36}, {"scene": "finale", "start": 58.376, "end": 62.273, "caption": "Il lavoro si fa lo stesso, in trenta secondi. E io… resto a casa.", "pauses": [[0.0, 3.897]], "speech": 3.897}];
  const L = LINES.filter((l) => l.scene === SID).map((l) => ({ ...l, a: l.start - S0, b: l.end - S0 }));
  const W = (i, word, edge = "start") => Anim.wordTime(L[i], word, edge) - S0;      // istante locale di una parola
  const MOUTH = (t, idle = "rest") => Anim.mouthAt(LINES, S0 + t, idle);           // lip-sync del Contratto
  const $ = (s) => document.querySelector("#riavvolgi " + s);
  const tl = gsap.timeline({ paused: true });

// Scena 7 - Riavvolgiamo. Tutto torna indietro di corsa (righe del nastro, lancetta all'indietro): la copia esce dallo
  // schermo e rientra nel Contratto, ChatGratis sprofonda nel portatile, il Mouse scappa all'indietro. Poi tutto si ferma.
  const SCR = { x: 465, y: 602 }, tR = L[0].a, tEnd = tR + 0.95;
  const back = (t, a, b) => Anim.ease("power2.inOut")(Anim.clamp((t - a) / (b - a)));
  const update = Anim.stage($("svg.stage"), Scenes.office({ fx: false }), Scenes.fx("warm"), (t) => {
    const u = back(t, 0.05, tEnd);                                   // avanzamento del riavvolgimento (0 -> 1)
    const c = { x: 1000, y: 864, s: 1.22, by: -302, bc: 10, lx: -150, ly: -120, rx: 150, ry: -120, idleMouth: "rest" };
    if (t > tR - 0.25) Object.assign(c, { rh: "point", rx: 175, ry: -250, rb: -0.25, px: -0.6, by: -308, bc: 12 });   // "Riavvolgiamo!" deciso
    if (t > tEnd + 0.2) Object.assign(c, { rh: "open", rx: 150, ry: -120, px: 0, lid: 0.15, idleMouth: "smile" });
    c.mouth = MOUTH(t, c.idleMouth); c.blink = Anim.blinkAt([tEnd + 0.5], t);
    let a = `<g transform="translate(1470,230)">${Props.secondHand(30 - u * 40)}</g><g transform="translate(1600,642)">${Props.steam(2 - t)}</g>`;
    // ChatGratis che sprofonda nello schermo
    const g = 1 - back(t, 0.05, 0.55);
    if (g > 0.01) a += Anim.place(Anim.chatgratis({ rx: 220, ry: -250, rh: "thumb", px: 1 }, t), { x: SCR.x, y: SCR.y + 64 - 50 * (1 - g), s: 0.86 * g });
    a += Anim.shadow({ ...c, ground: 864 }, 135);
    a += Anim.place(Anim.contratto(c, t), c);
    // la copia che rientra (arco al contrario)
    const k = back(t, 0.25, 0.95);
    if (k < 0.99) { const x = Anim.lerp(SCR.x, 1000, k), y = Anim.lerp(SCR.y + 40, 864, k) - Math.sin(k * Math.PI) * 260;
      a += `<g filter="url(#fxCopy)">${Anim.place(Anim.contratto({ open: 1.15, by: -312, bc: 16, mouth: "O", idle: 0 }, t), { x, y, s: 0.2 + 0.8 * k, r: 340 * (1 - k), o: 1 - 0.8 * k })}</g>`; }
    // il Mouse che corre all'indietro fuori campo
    const m = back(t, 0.15, 1.0);
    if (m < 0.99) a += Anim.place(Anim.mouse({ px: -0.8, stride: -t * 26 }, t), { x: 1440 + 900 * m, y: 868 - Math.abs(Math.sin(t * 13)) * 16, s: 0.95, r: 10 });
    // righe del nastro + leggera desaturazione mentre si riavvolge
    const tape = Anim.clamp(1 - Math.abs((t - (0.05 + tEnd) / 2) / ((tEnd - 0.05) / 2 + 0.15)) ** 6);
    let over = "";
    if (tape > 0.02) { over += `<rect width="1920" height="1080" fill="#1c2230" opacity="${0.22 * tape}"/>`;
      for (let i = 0; i < 9; i++) { const y = ((i * 137 + t * 2600) % 1180) - 50; over += `<rect x="0" y="${y}" width="1920" height="${10 + (i % 3) * 8}" fill="#fff" opacity="${0.12 * tape}"/>`; } }
    return { cam: { x: 960, y: 560, z: 1.0 }, actors: a, over };
  });
  Anim.drive(tl, DUR, update);
  tl.fromTo("#rw-tag", { opacity: 0, x: 160, filter: "blur(14px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0.1);
  tl.to("#rw-tag", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, tEnd + 0.3);
  window.__timelines[SID] = tl;
})();
</script>
</template>
